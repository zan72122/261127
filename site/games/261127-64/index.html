<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="safe"></div>
<script>
'use strict';
(function(){
/* =====================================================================
   どん、ぽん！墨たいこの山びらき
   - 大太鼓/小太鼓を叩く → 墨点が紙に落ち、山・松・霞・湖が育つ
   - 拍の輪と重なる一打は濃く締まり、外れた一打は水のようににじむ
   - 朱の合図 → 朱印 → 巻物が開き、舟（または山道）が動き出す
   - 完成した巻物は三枚まで並び、選ぶと次の曲の背景になる
   ===================================================================== */
const bgC=document.getElementById('bg'), cv=document.getElementById('cv'), safeEl=document.getElementById('safe');
const bctx=bgC.getContext('2d'), ctx=cv.getContext('2d');
let W=390,H=844,DPR=1; const SAFE={t:0,r:0,b:0,l:0};

/* ---------------- utils ---------------- */
function mulberry(a){a=a|0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const easeInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const pos=v=>v>0.01?v:0.01;
let seedCounter=(Math.random()*1e9)|0;
const newSeed=()=>{seedCounter=(seedCounter*1103515245+12345)&0x7fffffff;return seedCounter;};

/* 墨の五階調：焦 濃 重 淡 清 */
const INK=[[22,19,17],[44,40,36],[80,74,66],[128,120,108],[174,165,150]];
const rgba=(i,a)=>'rgba('+INK[i][0]+','+INK[i][1]+','+INK[i][2]+','+(a<0?0:(a>1?1:a)).toFixed(3)+')';
const SHEET='rgba(250,246,236,0.74)';
const SHU=[192,56,34];
const shu=a=>'rgba('+SHU[0]+','+SHU[1]+','+SHU[2]+','+a.toFixed(3)+')';

/* ---------------- world ---------------- */
const PW=1000, PH=640, BASE=392, MAXH=300, EXT=120, DX=10, NC=101;
const CUR0=78, CUR_END=962, LAKE_T=1.3, LAKE_MIN=8, STAND_H=30, MAXPINE=44, MAXMARKS=1400;

function hAt(P,x){ if(x<=0) return P.h[0]*Math.max(0,1+x/45); if(x>=PW) return P.h[NC-1]*Math.max(0,1-(x-PW)/45); const f=x/DX, i=f|0, t=f-i; return P.h[i]*(1-t)+P.h[Math.min(NC-1,i+1)]*t; }
function arrAt(a,x){ if(x<=0) return a[0]; if(x>=PW) return a[NC-1]; const f=x/DX, i=f|0, t=f-i; return a[i]*(1-t)+a[Math.min(NC-1,i+1)]*t; }
function profile(P,x0,x1,step,off){ const p=[]; x0=Math.max(-EXT+2,x0); x1=Math.min(PW+EXT-2,x1); for(let x=x0;x<x1+step*0.5;x+=step){ const xx=Math.min(x,x1); p.push(xx, BASE-hAt(P,xx)-(off||0)); } return p; }
function addKernel(a,cx,A,wl,wr,pw,cap){ for(let i=0;i<NC;i++){ const dx=i*DX-cx, w=dx<0?wl:wr, ad=Math.abs(dx); if(ad<w){ a[i]=Math.min(cap,a[i]+A*Math.pow(1-ad/w,pw)); } } }
function addGauss(a,cx,A,sig,cap){ const s2=2*sig*sig; for(let i=0;i<NC;i++){ const dx=i*DX-cx; if(Math.abs(dx)<sig*3.2) a[i]=Math.min(cap,a[i]+A*Math.exp(-dx*dx/s2)); } }
function profY(p,x){ const n=p.length/2; if(x<=p[0]) return p[1]; for(let i=1;i<n;i++){ if(x<=p[2*i]){ const t=(x-p[2*i-2])/((p[2*i]-p[2*i-2])||1); return lerp(p[2*i-1],p[2*i+1],t); } } return p[p.length-1]; }
function bbOf(p,pad){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(let i=0;i<p.length;i+=2){ x0=Math.min(x0,p[i]); x1=Math.max(x1,p[i]); y0=Math.min(y0,p[i+1]); y1=Math.max(y1,p[i+1]); } return [x0-pad,y0-pad,x1+pad,y1+pad]; }

function newPainting(){
  return {h:new Float32Array(NC), wet:new Float32Array(NC), head:new Float32Array(NC), near:new Float32Array(NC),
    pines:[], marks:[], runs:[], top:new Float32Array(NC), bot:new Float32Array(NC), isLake:new Uint8Array(NC), depth:new Float32Array(NC), shoreRuns:{}};
}
function clonePainting(P,keepGen){
  const Q=newPainting();
  Q.h.set(P.h); Q.wet.set(P.wet); Q.head.set(P.head); Q.near.set(P.near);
  Q.pines=P.pines.map(p=>({x:p.x,s:p.s,born:-99,st:p.st,y:p.y,flat0:p.flat0,lifted:p.lifted,v:p.v,sz:p.sz}));
  Q.marks=P.marks.filter(m=>keepGen||!m.gen);
  Q.shoreRuns=Object.assign({},P.shoreRuns);
  computeLakes(Q);
  return Q;
}
function addFoot(P){
  for(let i=0;i<NC;i++){ const x=i*DX; P.h[i]= x<120? 64*Math.pow(Math.max(0,1-x/120),1.2):0; }
  const pr=profile(P,-12,128,6); pr[1]=BASE-30;
  addMarkTo(P,{k:'wash',p:pr,ty:BASE-64,a:0.22,s:newSeed()});
  const rp=profile(P,-6,104,5,1);
  addMarkTo(P,{k:'ridge',p:rp,w0:6.2,w1:2,a:0.82,dry:1.15,s:newSeed()});
  addMarkTo(P,{k:'mist',x:40,y:BASE-8,w:130,h:14,a:0.8,s:newSeed()});
}

/* lakes from wetness */
function computeLakes(P){
  const runs=[]; let i=0;
  while(i<NC){ if(P.wet[i]>=LAKE_T){ let j=i; while(j+1<NC&&P.wet[j+1]>=LAKE_T) j++; if(j-i+1>=LAKE_MIN) runs.push({i0:i,i1:j}); i=j+1; } else i++; }
  P.isLake.fill(0); P.top.fill(BASE+3); P.bot.fill(BASE+3); P.depth.fill(0);
  for(const r of runs){
    const n=r.i1-r.i0+1; const maxD=Math.min(92,n*DX*0.14+14);
    for(let k=r.i0;k<=r.i1;k++){
      const u=(k-r.i0+0.5)/n; const e=Math.abs(2*u-1); const tp=Math.pow(Math.max(0,1-e*e),0.7);
      const d=Math.min(maxD,clamp(26+(P.wet[k]-LAKE_T)*38,0,96))*tp+4;
      P.depth[k]=d;
      let t=BASE+3+Math.min(P.head[k],d*0.62);
      let b=BASE+3+d-Math.min(P.near[k],d*0.62);
      const minC=Math.min(d,22)*tp;
      if(b-t<minC){ const m=(t+b)/2; t=m-minC/2; b=m+minC/2; if(t<BASE+3){ b+=BASE+3-t; t=BASE+3; } }
      P.top[k]=t; P.bot[k]=b; P.isLake[k]=1;
    }
    for(let pass=0;pass<2;pass++){ for(const A2 of [P.top,P.bot]){ const c=A2.slice(r.i0,r.i1+1); for(let k=r.i0+1;k<r.i1;k++){ const j=k-r.i0; A2[k]=c[j-1]*0.25+c[j]*0.5+c[j+1]*0.25; } } }
    for(let k=r.i0;k<=r.i1;k++){ if(P.bot[k]-P.top[k]<4){ const m=(P.top[k]+P.bot[k])/2; P.top[k]=Math.max(BASE+3,m-2); P.bot[k]=P.top[k]+4; } }
  }
  P.runs=runs;
  return runs;
}
function runAt(P,x){ const k=Math.round(x/DX); if(k<0||k>=NC||!P.isLake[k]) return null; for(const r of P.runs) if(k>=r.i0&&k<=r.i1) return r; return null; }
function lakeWidth(P){ let s=0; for(const r of P.runs) s+=(r.i1-r.i0+1)*DX; return s; }

/* ---------------- marks: brush renderers (world units) ---------------- */
function smoothClosed(g,pts){ const n=pts.length; g.beginPath(); g.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2); for(let i=0;i<n;i++){ const p=pts[i], q=pts[(i+1)%n]; g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2); } g.closePath(); }
function taper(g,p,w0,w1,col,wm){
  const n=p.length/2; if(n<2) return; const Lf=[],Rt=[];
  for(let i=0;i<n;i++){
    const a=i>0?i-1:0, b=i<n-1?i+1:n-1; let dx=p[2*b]-p[2*a], dy=p[2*b+1]-p[2*a+1]; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const t=i/(n-1); let w=(wm===undefined)?lerp(w0,w1,t):(t<.5?lerp(w0,wm,t*2):lerp(wm,w1,(t-.5)*2)); w*=0.5;
    Lf.push(p[2*i]-dy*w,p[2*i+1]+dx*w); Rt.push(p[2*i]+dy*w,p[2*i+1]-dx*w);
  }
  g.beginPath(); g.moveTo(Lf[0],Lf[1]);
  for(let i=1;i<n;i++) g.lineTo(Lf[2*i],Lf[2*i+1]);
  for(let i=n-1;i>=0;i--) g.lineTo(Rt[2*i],Rt[2*i+1]);
  g.closePath(); g.fillStyle=col; g.fill();
}
/* bristle brush: dry-brush (kasure) stroke. upto = points drawn (for animation) */
function bristle(g,p,w0,w1,sd,tone,alpha,dry,upto){
  const n=p.length/2; if(n<2) return; const R=mulberry(sd);
  const m=upto===undefined?n:Math.max(0,Math.min(n,upto|0)); const NB=7;
  const Lc=new Float32Array(n); for(let i=1;i<n;i++) Lc[i]=Lc[i-1]+Math.hypot(p[2*i]-p[2*i-2],p[2*i+1]-p[2*i-1]);
  const tot=Lc[n-1]||1; const NX=new Float32Array(n), NY=new Float32Array(n);
  for(let i=0;i<n;i++){ const a=i>0?i-1:0, b=i<n-1?i+1:n-1; const dx=p[2*b]-p[2*a], dy=p[2*b+1]-p[2*a+1]; const d=Math.hypot(dx,dy)||1; NX[i]=-dy/d; NY[i]=dx/d; }
  g.lineCap='round'; g.lineJoin='round';
  for(let b=0;b<NB;b++){
    const off=(b+0.5)/NB-0.5+(R()-.5)*0.07; const ink=0.55+R()*0.6, ph=R()*6.28, fq=3+R()*8;
    const lw=(w0/NB)*(1.3+R()*0.8), al=alpha*(0.55+R()*0.45);
    if(m<2) continue;
    g.strokeStyle=rgba(tone,al); g.lineWidth=lw;
    let on=false; g.beginPath();
    for(let i=0;i<m;i++){
      const t=Lc[i]/tot; const w=lerp(w0,w1,t)*(t<0.07?0.55+t*6.4:1);
      const x=p[2*i]+NX[i]*off*w, y=p[2*i+1]+NY[i]*off*w;
      const dv=dry*(t*1.1+Math.abs(off)*0.85)+0.32*dry*Math.sin(t*fq*3.1+ph);
      if(dv>ink){ if(on){ g.stroke(); g.beginPath(); on=false; } continue; }
      if(!on){ g.moveTo(x,y); on=true; } else g.lineTo(x,y);
    }
    if(on) g.stroke();
  }
}
function drawMark(g,m){
  const R=mulberry(m.s||1);
  switch(m.k){
  case 'dot':{
    const n=30, rx=m.r*1.32, ry=m.r*0.74, pts=[];
    for(let i=0;i<n;i++){ const th=i/n*Math.PI*2; const j=1+(R()-.5)*0.14+0.06*Math.sin(th*3+m.s); pts.push([Math.cos(th)*rx*j,Math.sin(th)*ry*j]); }
    g.save(); g.translate(m.x,m.y); g.rotate(m.a||0);
    g.fillStyle=rgba(0,0.94); smoothClosed(g,pts); g.fill();
    const gr=g.createRadialGradient(rx*0.2,ry*0.25,0,rx*0.2,ry*0.25,pos(m.r)); gr.addColorStop(0,rgba(0,0.6)); gr.addColorStop(1,rgba(0,0)); g.fillStyle=gr; g.fill();
    g.globalCompositeOperation='destination-out'; g.lineCap='round';
    for(let i=0;i<12;i++){ const yy=(R()*2-1)*ry*0.85; const xe=-rx*(0.05+R()*0.5); const len=rx*(0.35+R()*0.75); g.lineWidth=m.r*(0.02+R()*0.055); g.strokeStyle='rgba(0,0,0,'+(0.35+R()*0.6).toFixed(2)+')'; g.beginPath(); g.moveTo(-rx*1.15,yy+(R()-.5)*m.r*0.1); g.quadraticCurveTo(xe-len*0.5,yy+(R()-.5)*m.r*0.15,xe,yy); g.stroke(); }
    for(let i=0;i<12;i++){ const th=R()*Math.PI*2, rr=0.82+R()*0.22; g.fillStyle='rgba(0,0,0,0.85)'; g.beginPath(); g.arc(Math.cos(th)*rx*rr,Math.sin(th)*ry*rr,pos(m.r*(0.02+R()*0.05)),0,7); g.fill(); }
    g.globalCompositeOperation='source-over';
    for(let i=0;i<5;i++){ const th=R()*Math.PI*2, rr=1.18+R()*0.5; g.fillStyle=rgba(0,0.85); g.beginPath(); g.arc(Math.cos(th)*rx*rr,Math.sin(th)*ry*rr,pos(m.r*(0.03+R()*0.05)),0,7); g.fill(); }
    g.restore(); break; }
  case 'wash':{
    const p=m.p, n=p.length; if(n<4) break;
    g.beginPath(); g.moveTo(p[0],BASE+3); for(let i=0;i<n;i+=2) g.lineTo(p[i],p[i+1]); g.lineTo(p[n-2],BASE+3); g.closePath();
    const gr=g.createLinearGradient(0,m.ty,0,BASE+3); gr.addColorStop(0,rgba(2,m.a)); gr.addColorStop(0.4,rgba(3,m.a*0.55)); gr.addColorStop(1,rgba(4,0));
    g.fillStyle=gr; g.fill();
    g.save(); g.clip(); g.lineCap='round';
    const span=p[n-2]-p[0], cnt=Math.round(span/12*(m.a>0.15?1:0.5));
    for(let i=0;i<cnt;i++){ const x=p[0]+R()*span, yt=profY(p,x); if(BASE-yt<8) continue; const len=8+R()*Math.min(46,(BASE-yt)*0.6), y0=yt+2+R()*14; g.strokeStyle=rgba(2,0.05+R()*0.12*(m.a/0.26)); g.lineWidth=0.8+R()*2; g.beginPath(); g.moveTo(x,y0); g.quadraticCurveTo(x+(R()-.5)*8,y0+len*0.5,x+(R()-.5)*14,y0+len); g.stroke(); }
    g.restore(); break; }
  case 'ridge': bristle(g,m.p,m.w0,m.w1,m.s,1,m.a,m.dry); break;
  case 'thin':{
    const ca=Math.cos(m.a), sa=Math.sin(m.a), L=m.len;
    const pts=[m.x,m.y, m.x+ca*L*0.35+(-sa)*L*0.05, m.y+sa*L*0.35+ca*L*0.05, m.x+ca*L, m.y+sa*L];
    if(m.dense){ taper(g,pts,m.w*0.55,0.4,rgba(0,0.9),m.w); bristle(g,pts,m.w*0.9,m.w*0.3,m.s,0,0.5,1.0); }
    else { taper(g,pts,m.w*1.2,1.2,rgba(3,0.32),m.w*2); for(let i=0;i<16;i++){ const t=R(), x=m.x+ca*L*t, y=m.y+sa*L*t, fl=4+R()*14, fa=(R()<.5?0:Math.PI)+(R()-.5)*0.5; g.strokeStyle=rgba(3,0.07+R()*0.08); g.lineWidth=0.6+R(); g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(fa)*fl,y+Math.sin(fa)*fl*0.3); g.stroke(); } }
    break; }
  case 'blot':{
    for(let i=0;i<7;i++){ const cx=m.x+(R()-.5)*m.rx*0.9, cy=m.y+(R()-.5)*m.ry*0.5, rr=m.rx*(0.32+R()*0.42);
      g.save(); g.translate(cx,cy); g.scale(1,m.ry/m.rx*(0.8+R()*0.4)); const gr=g.createRadialGradient(0,0,0,0,0,pos(rr)); gr.addColorStop(0,rgba(3,0.17)); gr.addColorStop(0.7,rgba(3,0.09)); gr.addColorStop(1,rgba(3,0)); g.fillStyle=gr; g.beginPath(); g.arc(0,0,pos(rr),0,7); g.fill(); g.restore(); }
    const pts=[]; for(let i=0;i<24;i++){ const th=i/24*Math.PI*2, j=0.78+R()*0.3; pts.push([m.x+Math.cos(th)*m.rx*j, m.y+Math.sin(th)*m.ry*j]); }
    g.strokeStyle=rgba(2,0.13); g.lineWidth=1.3; smoothClosed(g,pts); g.stroke();
    g.lineCap='round';
    for(let i=0;i<44;i++){ const th=R()*Math.PI*2, sx=m.x+Math.cos(th)*m.rx*0.75, sy=m.y+Math.sin(th)*m.ry*0.75; const fa=(Math.cos(th)>0?0:Math.PI)+(R()-.5)*0.5, fl=m.rx*(0.15+R()*0.5); g.strokeStyle=rgba(3,0.05+R()*0.09); g.lineWidth=0.6+R()*1.2; g.beginPath(); g.moveTo(sx,sy); g.quadraticCurveTo(sx+Math.cos(fa)*fl*0.5,sy+Math.sin(fa)*fl*0.2+(R()-.5)*3,sx+Math.cos(fa)*fl,sy+Math.sin(fa)*fl*0.3); g.stroke(); }
    break; }
  case 'mist':{
    for(let i=0;i<5;i++){ const cx=m.x+(R()-.5)*m.w*0.5, cy=m.y+(R()-.5)*m.h*0.8, rx=m.w*(0.3+R()*0.3);
      g.save(); g.translate(cx,cy); g.scale(1,m.h/rx*(0.7+R()*0.5)); const gr=g.createRadialGradient(0,0,0,0,0,pos(rx)); gr.addColorStop(0,rgba(4,0.16*m.a)); gr.addColorStop(1,rgba(4,0)); g.fillStyle=gr; g.beginPath(); g.arc(0,0,pos(rx),0,7); g.fill(); g.restore(); }
    g.lineCap='round';
    for(let i=0;i<10;i++){ const x=m.x+(R()-.5)*m.w*0.9, y=m.y+(R()-.5)*m.h, l=m.w*(0.08+R()*0.2); g.strokeStyle=rgba(4,(0.08+R()*0.08)*m.a); g.lineWidth=0.8+R()*1.4; g.beginPath(); g.moveTo(x,y); g.lineTo(x+l,y+(R()-.5)*2); g.stroke(); }
    break; }
  case 'shore':{
    const p=m.p; if(!p||p.length<4) break;
    for(let i=0;i<6;i++){ const k=(R()*(p.length/2-1))|0; const x=p[2*k]+(R()-.5)*6, y=p[2*k+1]+(m.reeds?3:-3)*R(); g.fillStyle=rgba(0,0.82); g.beginPath(); g.ellipse(x,y,pos(1.4+R()*2.6),pos(1+R()*1.5),0,0,7); g.fill(); }
    if(m.reeds){ g.lineCap='round'; for(let i=0;i<4;i++){ const x=m.x+(R()-.5)*m.w*1.2, y=profY(p,x)+2; for(let j=-1;j<=1;j++){ const hh=5+R()*6; g.strokeStyle=rgba(1,0.7); g.lineWidth=0.9; g.beginPath(); g.moveTo(x,y); g.lineTo(x+j*3+(R()-.5)*2,y-hh); g.stroke(); } } }
    break; }
  case 'path':{
    const p=m.p, n=p.length/2; if(n<2) break; g.lineCap='round'; g.lineJoin='round';
    // reserved pale trail over the ink, edged on both sides, with step ticks
    g.strokeStyle='rgba(247,242,229,0.92)'; g.lineWidth=9; g.beginPath(); g.moveTo(p[0],p[1]); for(let i=1;i<n;i++) g.lineTo(p[2*i],p[2*i+1]); g.stroke();

let L=null;
function computeLayout(){
  const sl=SAFE.l, sr=SAFE.r, st=SAFE.t, sb=SAFE.b;
  const aw=Math.max(240,W-sl-sr), ah=Math.max(240,H-st-sb);
  const portrait=ah>aw*1.05; const o={portrait,aw,ah,sl,st};
  if(portrait){
    const sFull=(aw-36)/PW, sH=ah*0.42/PH;
    const s=clamp(sH,sFull,(aw-36)/640), VW=Math.min(PW,(aw-36)/s);
    const ss=Math.min((aw-24)/(PW+2*EXT), ah*0.4/PH);
    const bigR=Math.min(aw*0.205, ah*0.1), smallR=bigR*0.66;
    const floorY=st+ah-6;
    const ch=Math.min(ah*0.18, aw*0.42);
    const paperH=PH*s, drumTop=floorY-bigR*2.6;
    const free=Math.max(0,drumTop-st-paperH-ch);
    const top=st+Math.max(10,free*0.34);
    o.work={s,ox0:sl+(aw-VW*s)/2,oy:top,VW};
    const cy=Math.max(top+paperH*0.5,(st+drumTop)*0.5-ah*0.03);
    o.scroll={s:ss,ox:sl+(aw-(PW+2*EXT)*ss)/2+EXT*ss,oy:cy-PH*ss/2};
    o.ch=ch; o.feet=top+paperH+free*0.24+ch;
    o.drumW={B:{x:sl+aw*0.3,y:floorY-bigR*1.62,R:bigR},S:{x:sl+aw*0.765,y:floorY-smallR*1.38,R:smallR}};
    o.drumS=o.drumW;
    // gallery
    const gw=Math.min(aw*0.8,(drumTop-st-40)/4.25/(PH/(PW+2*EXT))), gh=gw*PH/(PW+2*EXT), gap=Math.max(10,gh*0.16);
    const gx=sl+Math.max(8,(aw-gw)/2-aw*0.06), gy=st+Math.max(12,(drumTop-st-(gh*3.62+gap*3))*0.4);
    o.slots=[0,1,2].map(i=>({x:gx,y:gy+i*(gh+gap),w:gw,h:gh}));
    o.blank={x:gx,y:gy+3*(gh+gap),w:gw*0.42,h:gh*0.62};
    o.galChild={x:Math.min(sl+aw-ch*0.3, gx+gw+ch*0.22), y:o.blank.y+o.blank.h+ch*0.15, h:ch*0.78};

    const s=Math.min(aw*0.6/PW, ah*0.56/PH), VW=Math.min(PW,aw*0.62/s);
    const ss=Math.min((aw-40)/(PW+2*EXT), ah*0.6/PH);
    const top=st+Math.max(10,ah*0.035);
    o.work={s,ox0:sl+(aw-VW*s)/2,oy:top,VW};
    o.scroll={s:ss,ox:sl+(aw-(PW+2*EXT)*ss)/2+EXT*ss,oy:top};
    const marg=(aw-VW*s)/2;
    const bigR=Math.min(ah*0.135, marg*0.46, aw*0.1), smallR=bigR*0.68;
    const floorY=st+ah-6;
    const paperB=top+PH*s;
    const ch=Math.min(ah*0.27, (floorY-paperB)*0.95);
    o.ch=ch; o.feet=Math.min(floorY-4, paperB+ch+(floorY-paperB-ch)*0.35);

    o.drumS=o.drumW;
    const gw=Math.min((aw*0.8-14)/2, ((floorY-bigR*2.6)-top-26)/2/(PH/(PW+2*EXT))), gh=gw*PH/(PW+2*EXT), gap=14;

    o.slots=[{x:gx,y:gy,w:gw,h:gh},{x:gx+gw+gap,y:gy,w:gw,h:gh},{x:gx,y:gy+gh+gap,w:gw,h:gh}];
    o.blank={x:gx+gw+gap+gw*0.25,y:gy+gh+gap+gh*0.18,w:gw*0.5,h:gh*0.64};

  const k=hitDrum(x,y);

function drumHit(kind,now){

/* ---------------- main update/render ---------------- */
function updateBeat(now){
  const B=S.beat; if(!B.active){ B.fade=Math.max(0,B.fade-0.03); return; }

  if(idx>B.lastIdx){ B.lastIdx=idx; const since=idx-B.hitIdx; if(since>8){ B.active=false; } else if(since<=5&&(S.phase==='paint'||S.phase==='play'||S.phase==='signal')){ sTick(); } }

function update(dt,now){

  if(S.pop){ S.pop.t+=dt; if(S.pop.t>0.3) S.pop=null; }
  if(S.lakeReveal){ S.lakeReveal.t+=dt; if(S.lakeReveal.t>1.3) S.lakeReveal=null; }

  if(vv&&vv.scale===1){ W=Math.round(vv.width)||W; H=Math.round(vv.height)||H; }

  const sig=[W,H,DPR,SAFE.t,SAFE.r,SAFE.b,SAFE.l].join(',');
  if(sig===doResize.sig&&LY.ink) return; doResize.sig=sig;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  computeLayout();
  drawBackground(); makeSheetPattern();
  for(const k of ['B','S']){ const d=S.drums[k], q=L.drumW[k]; d.x=q.x; d.y=q.y; d.R=q.R; SPR.drum[k]=makeDrum(k,q.R); }
  SPR.sigil=makeSigil(L.drumW.B.R);
  flushBlooms(); flushTasks();
  rebuildLayers();
  for(const sc of S.gallery) renderThumb(sc);
  S.child.snap=true;
  if(!S.child.x){ S.child.x=L.work.ox0+CUR0*L.work.s; }
}
function onResize(){ S.rzAt=performance.now()+120; if(!raf&&!document.hidden) startLoop(); }
window.addEventListener('resize',onResize); window.addEventListener('orientationchange',onResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',onResize);
let raf=0, last=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; if(!(dt>0)) dt=0; if(dt>0.05) dt=0.05;
  if(S.rzAt&&now>=S.rzAt){ S.rzAt=0; try{ doResize(); }catch(e){} }
  try{ update(dt,now); render(now); }catch(e){ if(!frame.err){ frame.err=1; console.warn(e); } }
}
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } S.beat.active=false; pointers.clear(); if(AU.ctx&&AU.ctx.state==='running') AU.ctx.suspend().catch(()=>{}); }
function startLoop(){ last=performance.now(); if(!raf) raf=requestAnimationFrame(frame); if(AU.ctx&&AU.ctx.state!=='running') AU.ctx.resume().catch(()=>{}); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopLoop(); else startLoop(); });
window.addEventListener('pagehide',stopLoop);
window.addEventListener('pageshow',()=>{ if(!document.hidden){ doResize(); startLoop(); } });

/* ---------------- boot ---------------- */
S.P=newPainting(); addFoot(S.P); computeLakes(S.P);
doResize();
beginPaint(S.P,false);
S.child.x=clamp(L.work.ox0+CUR0*L.work.s-L.ch*0.42,L.work.ox0,W);
S.child.tipX=L.work.ox0+CUR0*L.work.s; S.child.tipY=L.work.oy+(BASE-60)*L.work.s;
startLoop();

/* test hooks (no UI) */
window.__sumi={
  S, L:()=>L,
  drums:()=>({B:{x:S.drums.B.x,y:S.drums.B.y,R:S.drums.B.R},S:{x:S.drums.S.x,y:S.drums.S.y,R:S.drums.S.R}}),
  slots:()=>({slots:L.slots.slice(0,S.gallery.length),blank:blankRect()}),
  state:()=>{ const P=S.P; let peak=0; for(let i=0;i<NC;i++) peak=Math.max(peak,P.h[i]); return {phase:S.phase,cursor:S.cursor,marks:P.marks.length,lakes:P.runs.length,lakeWidth:lakeWidth(P),pines:P.pines.length,standing:P.pines.filter(p=>p.st>0.5).length,flat:P.pines.filter(p=>p.st<=0.5).length,peak,mode:S.mode,trav:S.trav?Math.round(S.trav.x):null,gallery:S.gallery.map(g=>({id:g.id,marks:g.P.marks.length,pines:g.P.pines.length,lake:lakeWidth(g.P)})),sourceId:S.sourceId,newestId:S.newestId,beat:{active:S.beat.active,t0:S.beat.t0,T:S.beat.T},target:S.target,signal:S.signal,seal:!!S.seal,songN:S.songN,stats:S.stats,demo:!!S.demo,blooms:S.blooms.length,tasks:S.tasks.length+(S.task?1:0),parts:S.parts.length}; },
  paperRect:()=>{ const PT=curPT(); const vr=visRange(); return {x:PT.ox+vr[0]*PT.s,y:PT.oy,w:(vr[1]-vr[0])*PT.s,h:PH*PT.s}; },
  inkSum:()=>{ const PT=curPT(); const vr=visRange(); const x=Math.round((PT.ox+vr[0]*PT.s)*DPR), y=Math.round(PT.oy*DPR), w=Math.round((vr[1]-vr[0])*PT.s*DPR), h=Math.round(PH*PT.s*DPR); const d=ctx.getImageData(x,y,w,h).data; let s=0; for(let i=0;i<d.length;i+=16){ const lum=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11); s+=(255-lum)*(d[i+3]/255); } return Math.round(s); },
  audio:()=>AU.ctx?AU.ctx.state:'none', pointers:()=>pointers.size, running:()=>!!raf, time:()=>S.time,
  nextBeatMs:()=>{ const B=S.beat; if(!B.active) return 0; const now=performance.now(); const ph=(now-B.t0)/B.T; return (Math.ceil(ph)-ph)*B.T; }
};
})();
