<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#171a2b">
  <title>Atlas Dusk Carpet</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #171a2b;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
      position: fixed; inset: 0;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #veil {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #3a2d3c 0%, #14182a 100%);
      opacity: 1; transition: opacity 1.3s ease-out;
    }
    #fps {
      position: fixed; top: 8px; left: 8px; display: none;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(14, 18, 32, 0.62); color: #efe8d8;
      font: 11px/1.4 ui-monospace, Menlo, monospace; pointer-events: none;
      white-space: pre;
    }
    #action-btn {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid rgba(226, 178, 86, 0.62);
      background: radial-gradient(circle at 35% 30%, rgba(242, 206, 134, 0.25), rgba(22, 30, 52, 0.48));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.28s ease, transform 0.28s ease;
      cursor: pointer;
    }
    #action-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    #action-btn:active {
      transform: scale(0.93);
    }
    #action-btn svg {
      width: 40px;
      height: 40px;
      display: block;
    }
  </style>

<script src="/gf-nav.js" defer></script>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="action-btn" type="button" aria-label="action">
    <!-- Wordless silk canopy + figure icon (dismount / gentle float) -->
    <svg id="icon-float" viewBox="0 0 64 64" fill="none">
      <path d="M12 27 C17 13, 47 13, 52 27 C43 24, 21 24, 12 27 Z" fill="#f3d28a" fill-opacity="0.92"/>
      <path d="M32 25 L32 41" stroke="#4ac5be" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="32" cy="44" r="3.8" fill="#faf0da"/>
      <path d="M26 55 C28 49, 36 49, 38 55" stroke="#faf0da" stroke-width="2.8" stroke-linecap="round"/>
    </svg>
    <!-- Wordless woven carpet icon (call / re-board) -->
    <svg id="icon-call" viewBox="0 0 64 64" fill="none" style="display:none">
      <path d="M10 38 C20 27, 42 25, 54 32 C44 43, 22 45, 10 38 Z" fill="#e2a832" fill-opacity="0.92" stroke="#4ac5be" stroke-width="2"/>
      <path d="M23 35 L32 32 L40 35 L31 38 Z" fill="#2d9d96"/>
      <path d="M10 38 L5 41 M54 32 L59 35 M17 42 L13 46 M46 37 L50 41" stroke="#f6deb0" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="veil"></div>
  <div id="fps"></div>
  <script>
    window.__ready = false;
    window.__errors = [];
    window.__moment = 'garden';
    window.__autolog = [];
    window.__autodone = false;
    window.addEventListener('error', function (e) {
      var msg = (e && (e.message || (e.error && e.error.stack))) || String(e);
      window.__errors.push(msg);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      window.__errors.push(r ? (r.stack || r.message || String(r)) : 'unhandledrejection');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
