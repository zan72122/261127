<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e2d3b">
  <link rel="icon" href="data:,">
  <title>水辺の大きな紙ひこうきと棚田の風</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1e2d3b;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
      position: fixed; inset: 0;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #veil {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #8ec1e3 0%, #243e6b 100%);
      opacity: 1; transition: opacity 1.3s ease-out;
    }
    #fps {
      position: fixed; top: 8px; left: 8px; display: none;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(16, 26, 38, 0.6); color: #eef4fa;
      font: 11px/1.4 ui-monospace, Menlo, monospace; pointer-events: none;
      white-space: pre;
    }
    #action-btn {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid rgba(245, 240, 220, 0.72);
      background: radial-gradient(circle at 35% 30%, rgba(248, 244, 232, 0.34), rgba(36, 62, 107, 0.45));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.25s ease, transform 0.25s ease;
      cursor: pointer;
    }
    #action-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    #action-btn:active {
      transform: scale(0.93);
    }
    #action-btn svg {
      width: 40px;
      height: 40px;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="action-btn" type="button" aria-label="action">
    <!-- Wordless dandelion-fluff / parasol canopy icon (dismount & slow descent) -->
    <svg id="icon-float" viewBox="0 0 64 64" fill="none">
      <path d="M12 28 C18 14, 46 14, 52 28 C44 25, 20 25, 12 28 Z" fill="#f7f4eb" fill-opacity="0.94"/>
      <path d="M32 25 L32 42" stroke="#e6aa24" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="32" cy="45" r="3.8" fill="#f7f4eb"/>
      <path d="M26 55 C28 49, 36 49, 38 55" stroke="#f7f4eb" stroke-width="2.8" stroke-linecap="round"/>
    </svg>
    <!-- Wordless origami paper airplane icon (call / re-board) -->
    <svg id="icon-call" viewBox="0 0 64 64" fill="none" style="display:none">
      <path d="M10 34 L54 16 L36 48 L29 36 Z" fill="#f7f4eb" fill-opacity="0.95"/>
      <path d="M54 16 L29 36 L27 46 L34 39" stroke="#243e6b" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    </svg>
  </button>
  <div id="veil"></div>
  <div id="fps"></div>
  <script>
    window.__ready = false;
    window.__errors = [];
    window.__moment = 'garden';
    window.__autolog = [];
    window.__autodone = false;
    window.addEventListener('error', function (e) {
      var msg = (e && (e.message || (e.error && e.error.stack))) || String(e);
      window.__errors.push(msg);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      window.__errors.push(r ? (r.stack || r.message || String(r)) : 'unhandledrejection');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
