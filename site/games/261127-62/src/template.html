<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<title>どうぞ、どうぞ！おにんぎょうのおうち</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e7d6c2;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overscroll-behavior:none;position:fixed;inset:0}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 46%,rgba(0,0,0,0) 62%,rgba(70,40,20,.16) 100%)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#fff6ea 0%,#f3dcc8 60%,#e2c3ad 100%);transition:opacity .7s;z-index:5;pointer-events:none}
#boot.hide{opacity:0}
#boot svg{width:24vmin;height:24vmin;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-1.2vmin) rotate(-4deg)}to{transform:translateY(1.2vmin) rotate(4deg)}}
#hand{position:fixed;left:0;top:0;width:86px;height:86px;margin:-14px 0 0 -30px;pointer-events:none;opacity:0;transition:opacity .35s;z-index:4;filter:drop-shadow(0 5px 6px rgba(60,30,10,.35));will-change:transform}
#hand.show{opacity:.96}
#edgeL,#edgeR{position:fixed;top:30%;bottom:30%;width:7vw;pointer-events:none;opacity:0;transition:opacity .6s;z-index:3}
#edgeL{left:0;background:radial-gradient(ellipse 100% 50% at 0% 50%,rgba(255,244,214,.85),rgba(255,244,214,0))}
#edgeR{right:0;background:radial-gradient(ellipse 100% 50% at 100% 50%,rgba(255,244,214,.85),rgba(255,244,214,0))}
#edgeL.on,#edgeR.on{opacity:.75;animation:edge 2.4s ease-in-out infinite}
@keyframes edge{50%{opacity:.35}}
#edgeL.hint,#edgeR.hint{width:11vw;animation-duration:1.4s}
#hand .pinch{display:none}#hand.pin .open{display:none}#hand.pin .pinch{display:inline}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="vig"></div>
<div id="edgeL"></div><div id="edgeR"></div>
<div id="safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<svg id="hand" viewBox="0 0 86 86" aria-hidden="true">
<defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9db"/><stop offset="1" stop-color="#f1c3a8"/></linearGradient></defs>
<g class="open"><path d="M30 6c4 0 6 3 6 7v22l3-1c4-1 7 1 8 3l1 1c3-1 7 0 8 3 3-1 7 1 7 5v15c0 11-8 19-19 19h-7c-7 0-12-4-15-9L13 52c-2-4 1-7 5-7 3 0 4 2 6 4l1 2V13c0-4 2-7 5-7z" fill="url(#hg)" stroke="#b07f66" stroke-width="2.2" stroke-linejoin="round"/><path d="M31 9c2 0 3 1 3 3" stroke="#fff" stroke-width="2" fill="none" opacity=".7" stroke-linecap="round"/></g>
<g class="pinch"><path d="M28 14c4-1 7 2 7 6l1 14 4-1c4-1 7 1 8 3 3-1 7 0 8 3 3-1 7 1 7 5v13c0 11-8 19-19 19h-7c-7 0-12-4-15-9l-6-12c-2-4 0-7 4-8l9-1-5-25c-1-4 1-7 4-7z" fill="url(#hg)" stroke="#b07f66" stroke-width="2.2" stroke-linejoin="round"/><circle cx="27" cy="12" r="3.2" fill="#fff" opacity=".55"/></g>
</svg>
<div id="boot"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 L88 44 L80 44 L80 86 L20 86 L20 44 L12 44 Z" fill="#f6dfe2" stroke="#d99aa6" stroke-width="3" stroke-linejoin="round"/><rect x="40" y="58" width="20" height="28" rx="3" fill="#bfe6d6" stroke="#7fb7a2" stroke-width="2.5"/><circle cx="55" cy="72" r="2" fill="#d9a441"/><circle cx="31" cy="56" r="6" fill="#fff6e0" stroke="#d99aa6" stroke-width="2.5"/><circle cx="69" cy="56" r="6" fill="#fff6e0" stroke="#d99aa6" stroke-width="2.5"/></svg></div>
