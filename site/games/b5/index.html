<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#163a4a">
  <title>光のクジラとサンゴ礁の浅瀬</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #163a4a;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
      position: fixed; inset: 0;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #veil {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #2b5968 0%, #122c3a 100%);
      opacity: 1; transition: opacity 1.3s ease-out;
    }
    #fps {
      position: fixed; top: 8px; left: 8px; display: none;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(12, 26, 36, 0.62); color: #eef5f2;
      font: 11px/1.4 ui-monospace, Menlo, monospace; pointer-events: none;
      white-space: pre;
    }
    #action-btn {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid rgba(255, 224, 176, 0.62);
      background: radial-gradient(circle at 35% 30%, rgba(255, 232, 192, 0.28), rgba(20, 56, 74, 0.48));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.28s ease, transform 0.28s ease;
      cursor: pointer;
    }
    #action-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    #action-btn:active {
      transform: scale(0.92);
    }
    #action-btn svg {
      width: 38px;
      height: 38px;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="action-btn" type="button" aria-label="action">
    <!-- Wordless canopy icon (dismount / slow descent) -->
    <svg id="icon-float" viewBox="0 0 64 64" fill="none">
      <path d="M12 27 C17 13, 47 13, 52 27 C44 24, 20 24, 12 27 Z" fill="#fff3dc" fill-opacity="0.92"/>
      <path d="M32 25 L32 41" stroke="#ffd89c" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="32" cy="44" r="3.8" fill="#fff3dc"/>
      <path d="M26 54 C28 49, 36 49, 38 54" stroke="#fff3dc" stroke-width="2.8" stroke-linecap="round"/>
    </svg>
    <!-- Wordless whale fluke icon (call whale / re-board) -->
    <svg id="icon-whale" viewBox="0 0 64 64" fill="none" style="display:none">
      <path d="M12 37 C21 25, 39 24, 52 33 C45 38, 39 40, 32 41 C24 41, 17 39, 12 37 Z" fill="#fff3dc" fill-opacity="0.94"/>
      <path d="M46 31 C51 24, 56 22, 57 25 C55 29, 53 32, 51 34 C54 36, 57 38, 56 42 C53 41, 49 38, 46 34 Z" fill="#ffd89c" fill-opacity="0.92"/>
    </svg>
  </button>
  <div id="veil"></div>
  <div id="fps"></div>
  <script>
    window.__ready = false;
    window.__errors = [];
    window.__moment = 'garden';
    window.__autolog = [];
    window.__autodone = false;
    window.addEventListener('error', function (e) {
      var msg = (e && (e.message || (e.error && e.error.stack))) || String(e);
      window.__errors.push(msg);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      window.__errors.push(r ? (r.stack || r.message || String(r)) : 'unhandledrejection');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
