<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b130d">
<title>よるの すいそう</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1d14; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hint { position: fixed; left: 0; top: 0; width: 76px; height: 76px; pointer-events: none; opacity: 0; transition: opacity .4s; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); z-index: 3; }
  #hint.on { opacity: .95; animation: tap 1.1s ease-in-out infinite; }
  @keyframes tap { 0%,100% { transform: translate(var(--x), var(--y)) scale(1); } 45% { transform: translate(var(--x), calc(var(--y) + 10px)) scale(.92); } }
  #veil { position: fixed; inset: 0; background: #2a1d14; z-index: 5; transition: opacity 1.2s; display: flex; align-items: center; justify-content: center; }
  #veil.off { opacity: 0; pointer-events: none; }
  #veil .drop { width: 46px; height: 46px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: radial-gradient(circle at 35% 35%, #d6f2ee, #4f9c97 70%); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: rotate(-45deg) scale(.8); opacity: .6; } }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 4; transition: opacity .5s; }
</style>

<script src="../../gf-playlog.js" defer></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<svg id="hint" viewBox="0 0 64 64" aria-hidden="true">
  <path d="M24 30V10a5 5 0 0 1 10 0v15l1-.2a5 5 0 0 1 9 2.2l1-.1a5 5 0 0 1 8 3v.6a5 5 0 0 1 7 4V45c0 9-7 16-16 16h-6c-6 0-10-3-13-8L14 41a5 5 0 0 1 8-6z" fill="#fff" stroke="#7a6a5a" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
<div id="fade"></div>
<div id="veil"><div class="drop"></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
