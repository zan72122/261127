<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9cbb2">
<title>びんのなかのもり</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#d8c9ae;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#veil{position:fixed;inset:0;pointer-events:none;transition:opacity 1.2s ease;
  background:radial-gradient(ellipse at 30% 25%,#fff4dc 0%,#e8d8b8 40%,#cbb894 100%)}
#veil i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#9fc06a,#56782d 60%,#3d5a1f);box-shadow:0 6px 18px rgba(80,60,30,.35);
  animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 62%,rgba(40,25,10,.20) 100%)}
#hint{position:fixed;left:0;top:0;width:84px;height:84px;margin:-8px 0 0 -30px;pointer-events:none;opacity:0;
  transition:opacity .5s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));will-change:transform}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff8e8;opacity:0;transition:opacity .6s}
</style>

<script src="../../gf-playlog.js" defer></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<svg id="hint" viewBox="0 0 84 84" aria-hidden="true">
  <path d="M30 8c-4 0-7 3-7 7v31l-5-6c-3-3-7-3-10 0-2 2-2 6 0 9l15 18c4 5 9 8 16 8h10c10 0 17-8 17-17V38c0-4-3-6-6-6s-6 2-6 6v-2c0-4-3-6-6-6s-6 2-6 6v-2c0-4-3-6-6-6-2 0-4 1-5 2V15c0-4-3-7-7-7z"
    fill="#fffdf8" stroke="#b9ab94" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
<div id="veil"><i></i></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
