<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#d9d4c8">
<title>なぞの あしあと</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#d9d4c8;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-touch-callout:none}
#hint{pointer-events:none;z-index:2}
#cover{position:fixed;inset:0;background:#d9d4c8;z-index:3;transition:opacity .8s;pointer-events:none}
#cover.off{opacity:0}
#cover i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;
  border:5px solid rgba(80,70,60,.25);border-top-color:rgba(80,70,60,.7);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hint"></canvas>
<div id="cover"><i></i></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
