<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a120c">
<title>あついガラス つめたいガラス</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120c; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; display: block; touch-action: none; }
  #cover { position: fixed; inset: 0; background: radial-gradient(circle at 40% 55%, #6a3a18 0%, #2a160a 45%, #120a06 100%); transition: opacity 1.2s ease; pointer-events: none; }
  #cover::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff3c0, #ffa030 45%, #c04010 80%); box-shadow: 0 0 40px 10px rgba(255,140,40,.6); animation: glow 1.4s ease-in-out infinite alternate; }
  @keyframes glow { from { transform: scale(.85); } to { transform: scale(1.1); } }
  #hint { position: fixed; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(circle, rgba(255,250,235,0) 42%, rgba(255,250,235,.55) 55%, rgba(255,250,235,0) 70%); animation: pulse 1.6s ease-in-out infinite; will-change: transform; }
  @keyframes pulse { 0% { scale: .8; } 50% { scale: 1.08; } 100% { scale: .8; } }
  #hand { position: fixed; left: 0; top: 0; width: 64px; height: 76px; margin: 6px 0 0 -14px; pointer-events: none; opacity: 0; transition: opacity .6s; will-change: transform; }
  #hand svg { width: 100%; height: 100%; animation: tap 1.2s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  @keyframes tap { 0%, 100% { transform: translate(6px, 10px); } 50% { transform: translate(0, 0); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="hand"><svg viewBox="0 0 64 76" aria-hidden="true">
  <path d="M14 4c4 0 6 3 6 6v24l3-1V24c0-3 2-5 5-5s5 2 5 5v8l2-1v-4c0-3 2-5 5-5s5 2 5 5v5l2 0c0-3 2-5 5-5s5 2 5 5v19c0 13-8 23-21 23H33c-8 0-13-4-17-10L4 46c-2-3-1-6 1-8 3-2 6-1 8 1l1 2V10c0-3 0-6 0-6z" fill="#fff" stroke="#8a8a8a" stroke-width="2" stroke-linejoin="round"/>
</svg></div>
<div id="cover"></div>
<script type="module" src="js/game.js"></script>
</body>
</html>
