<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a2c3a">
<title>しょうぼうし ほうすいくんれん</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2b2230;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-touch-callout:none}
#load{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#38456e 0%,#8a6a88 45%,#e7a36a 78%,#f2c58a 100%);transition:opacity .8s ease}
#load.off{opacity:0;pointer-events:none}
#load .drop{width:46px;height:62px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 35%,#fff 0%,#cfe6ff 35%,#6fa3d8 100%);
  box-shadow:0 6px 20px rgba(0,0,0,.25);animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-8px) scale(1,1)}50%{transform:translateY(8px) scale(1.05,.95)}}
#hint{position:fixed;left:0;top:0;width:76px;height:76px;margin:-6px 0 0 -18px;z-index:10;pointer-events:none;opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
#hint svg{width:76px;height:76px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translate(8px,10px) scale(1)}45%{transform:translate(0,0) scale(.92)}55%{transform:translate(0,0) scale(.92)}}
#fade{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .5s ease}
#fade.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#fff" stroke="#9aa3ad" stroke-width="1.5" d="M20 4c2.8 0 5 2.2 5 5v17.5c.8-.6 1.8-1 3-1 2.3 0 4.2 1.5 4.8 3.6.8-.6 1.9-1 3.1-1 2.4 0 4.4 1.7 4.9 3.9.8-.5 1.7-.8 2.7-.8 2.8 0 5 2.2 5 5V48c0 7-5.7 12-12.7 12h-5.6c-4.4 0-8.4-2.2-10.8-5.9L8.6 39.6c-1.3-2-.9-4.7 1-6.2 1.9-1.5 4.6-1.3 6.2.5L15 34V9c0-2.8 2.2-5 5-5z"/></svg></div>
<div id="fade"></div>
<div id="load"><div class="drop"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
