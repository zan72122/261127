const Q=(function(){const o={};try{location.search.replace(/[?&]([^=&]+)=?([^&]*)/g,function(m,k,v){o[k]=decodeURIComponent(v);});}catch(e){}return o;})();
const SPEED=Math.min(8,Math.max(0.25,(+Q.speed)||1));
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const oBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SEED=(Q.seed!==undefined)?((+Q.seed)|0):((Math.random()*1e9)|0);
const R=mulberry(SEED);
const JR=mulberry(20261127);
const JT=new Float32Array(512);for(let i=0;i<512;i++)JT[i]=JR()*2-1;
const rnd=Math.random;
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ============================================================

function P2(a){const p=new Path2D();p.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)p.lineTo(a[i],a[i+1]);p.closePath();return p;}
function addPts(p,a){p.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)p.lineTo(a[i],a[i+1]);p.closePath();}
function ngon(cx,cy,rx,ry,n,j,o,rot){const a=[];rot=rot||0;o=o||0;for(let i=0;i<n;i++){const t=rot+i/n*TAU;const k=1+JT[(o+i)&511]*j;a.push(cx+Math.cos(t)*rx*k,cy+Math.sin(t)*ry*k);}return a;}
function rect(x,y,w,h,j,o){j=j||0;o=o||0;return [x+JT[o&511]*j,y+JT[(o+1)&511]*j,x+w+JT[(o+2)&511]*j,y+JT[(o+3)&511]*j,x+w+JT[(o+4)&511]*j,y+h+JT[(o+5)&511]*j,x+JT[(o+6)&511]*j,y+h+JT[(o+7)&511]*j];}
function jit(a,j,o){const b=a.slice();o=o||0;for(let i=0;i<b.length;i++)b[i]+=JT[(o+i)&511]*j;return b;}
function star(cx,cy,r1,r2,n,rot){const a=[];for(let i=0;i<n*2;i++){const t=(rot||0)+i/(n*2)*TAU-Math.PI/2;const r=i%2?r2:r1;a.push(cx+Math.cos(t)*r,cy+Math.sin(t)*r);}return a;}
// paper layer: offset drop shadow (light from upper-left), white cut edge, single colour face
function paperP(p,col,d,ang){
  d=(d===undefined)?1:d;
  if(d>0){let ox=2.4*d,oy=3.3*d;if(ang){const c=Math.cos(-ang),s=Math.sin(-ang);const x=ox*c-oy*s,y=ox*s+oy*c;ox=x;oy=y;}
    ctx.translate(ox,oy);ctx.fillStyle=C.sh;ctx.fill(p,'evenodd');ctx.translate(-ox,-oy);}
  let ex=0,ey=1.3;if(ang){const c=Math.cos(-ang),s=Math.sin(-ang);ex=-ey*s;ey=ey*c;}
  ctx.translate(ex,ey);ctx.fillStyle=C.white;ctx.fill(p,'evenodd');ctx.translate(-ex,-ey);
  ctx.fillStyle=col;ctx.fill(p,'evenodd');
}
function paperA(a,col,d,ang){paperP(P2(a),col,d,ang);}
function flat(p,col){ctx.fillStyle=col;ctx.fill(p,'evenodd');}
function flatA(a,col){flat(P2(a),col);}

let AC=null,MG=null,NB=null;
function initAudio(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      AC=new A();MG=AC.createGain();MG.gain.value=0.62;
      const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=4;
      MG.connect(cp);cp.connect(AC.destination);
      const n=AC.sampleRate|0;NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      const b=AC.createBufferSource();b.buffer=AC.createBuffer(1,1,22050);b.connect(AC.destination);b.start(0);
    }
    if(AC.state==='suspended'&&!document.hidden){const p=AC.resume();if(p&&p.catch)p.catch(function(){});}
  }catch(e){AC=null;}
}
function ok(){return AC&&AC.state==='running';}
function envG(g,t0,a,pk,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
function tone(f,dur,type,vol,dl,f2,a){
  if(!ok())return;try{const t0=AC.currentTime+(dl||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  envG(g,t0,a||0.004,vol||0.2,dur);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}
}
function nz(dur,vol,f,q,dl,type,f2,a){
  if(!ok())return;try{const t0=AC.currentTime+(dl||0);const s=AC.createBufferSource();s.buffer=NB;
  const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);fl.Q.value=q||1;
  const g=AC.createGain();envG(g,t0,a||Math.min(0.02,dur*0.3),vol,dur);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t0,Math.random()*0.4);s.stop(t0+dur+0.05);}catch(e){}
}

  gear(p){p=p||1;tone(520*p,0.05,'square',0.05);tone(780*p,0.09,'triangle',0.11,0.03);nz(0.04,0.14,1900,3);},
  stretch(lv){const f=300+lv*90;nz(0.26,0.2,f,2,0,'bandpass',f*2.2);tone(f*0.9,0.18,'triangle',0.07,0.04,f*1.5);},
  snip(lv){nz(0.04,0.26,4200,4);nz(0.04,0.22,3600,4,0.09);tone(1300-lv*130,0.07,'triangle',0.07,0.03,1700-lv*150);},
  crank(d){for(let i=0;i<3;i++)tone((d>0?620:540)+i*(d>0?70:-50),0.04,'square',0.045,i*0.06);nz(0.18,0.12,900,2,0,'bandpass',d>0?1600:500);},
  boing(){tone(210,0.3,'sine',0.14,0,140);},

  bell(p){p=p||1;tone(1320*p,0.6,'sine',0.11);tone(1980*p,0.42,'sine',0.05,0.012);},

  tap(){nz(0.04,0.07,1300,2);tone(600+rnd()*200,0.04,'sine',0.03);},
  whoosh(){nz(0.42,0.15,600,1,0,'bandpass',2600);},

// ============================================================
//  layout : machine panel (MW x MH) + street panel (TW x TH)
// ============================================================
let DPR=1,SW=1,SH=1,PORT=true;
const SA={t:0,r:0,b:0,l:0};
const MW=560,MH=600,TW=960,TH=660;
const LM={s:1,x:0,y:0},LT={s:1,x:0,y:0};
const RM={x:0,y:0,w:1,h:1},RT={x:0,y:0,w:1,h:1};
function readSA(){try{const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function layout(){
  readSA();
  SW=Math.max(1,window.innerWidth|0);SH=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1,Math.sqrt(2.3e6/(SW*SH)));DPR=Math.max(1,DPR);
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);cv.style.width=SW+'px';cv.style.height=SH+'px';
  const ux=SA.l+4,uy=SA.t+4,uw=SW-SA.l-SA.r-8,uh=SH-SA.t-SA.b-8;
  PORT=uw/uh<1.0;
  if(PORT){
    const VW=878,ts=uw/VW,th=TH*ts;
    const ms=Math.min(uw/MW,(uh-th)/MH);
    const mh=MH*ms,gap=Math.max(0,(uh-th-mh)/3);
    LM.s=ms;LM.x=ux+(uw-MW*ms)/2;LM.y=uy+gap;
    LT.s=ts;LT.x=ux-6*ts;LT.y=uy+gap*2+mh;
    const sp=Math.round(LT.y-gap*0.5);
    RM.x=0;RM.y=0;RM.w=SW;RM.h=sp;RT.x=0;RT.y=sp;RT.w=SW;RT.h=SH-sp;
  }else{
    const ms=Math.min(uh/MH,uw*0.34/MW);
    const ts=Math.min((uw-MW*ms)/TW,uh/TH);
    const mw=MW*ms,tw=TW*ts,gap=Math.max(0,(uw-mw-tw)/3);
    LM.s=ms;LM.x=ux+gap;LM.y=uy+(uh-MH*ms)/2;
    LT.s=ts;LT.x=ux+gap*2+mw;LT.y=uy+uh-TH*ts+Math.min(SA.b,24);
    const sp=Math.round(LT.x-gap*0.5);
    RM.x=0;RM.y=0;RM.w=sp;RM.h=SH;RT.x=sp;RT.y=0;RT.w=SW-sp;RT.h=SH;
  }
  buildCaches();buildBelts();
}
function m2s(x,y){return {x:LM.x+x*LM.s,y:LM.y+y*LM.s};}
function t2s(x,y){return {x:LT.x+x*LT.s,y:LT.y+y*LT.s};}
function s2m(x,y){return {x:(x-LM.x)/LM.s,y:(y-LM.y)/LM.s};}
function s2t(x,y){return {x:(x-LT.x)/LT.s,y:(y-LT.y)/LT.s};}
function useM(){ctx.setTransform(DPR*LM.s,0,0,DPR*LM.s,DPR*LM.x,DPR*LM.y);}
function useT(){ctx.setTransform(DPR*LT.s,0,0,DPR*LT.s,DPR*LT.x,DPR*LT.y);}
function useS(){ctx.setTransform(DPR,0,0,DPR,0,0);}

function tubePt(k,u){const t=TUBES[k],inf=TL[k];let d=clamp(u,0,1)*inf.L;
  for(let i=0;i<inf.seg.length;i++){if(d<=inf.seg[i]||i===inf.seg.length-1){const f=clamp(d/inf.seg[i],0,1);return {x:lerp(t[i*2],t[i*2+2],f),y:lerp(t[i*2+1],t[i*2+3],f)};}d-=inf.seg[i];}

// ============================================================
//  save / load (localStorage, validated; falls back to memory)
// ============================================================
const SKEY='gf-261127-65-v1';
let canSave=true;
function save(){
  if(!canSave)return;
  try{
    const o={v:1,signs:SIGNS.map(function(s){return {x:Math.round(s.x),k:s.kind,d:s.dir,l:Math.round(s.len),a:s.doors?s.doors.slice():null};}),buys:BUYS.slice(-12)};
    localStorage.setItem(SKEY,JSON.stringify(o));
  }catch(e){canSave=false;}
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(SKEY);}catch(e){canSave=false;return null;}
  if(!raw)return null;
  try{
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object'||o.v!==1)throw new Error('bad');
    const out={signs:[],buys:[]};
    if(Array.isArray(o.signs)){
      for(const s of o.signs.slice(0,4)){
        if(!s||typeof s!=='object')continue;
        const x=+s.x,l=+s.l;
        if(!isFinite(x)||x<-40||x>1000)continue;
        if(['arrow','bridge','dot'].indexOf(s.k)<0)continue;
        let a=null;
        if(s.k==='bridge'){
          if(!Array.isArray(s.a)||s.a.length!==2)continue;
          a=[s.a[0]|0,s.a[1]|0];
          if(a[0]<0||a[0]>3||a[1]<0||a[1]>3||a[0]===a[1])continue;
        }
        out.signs.push({x:clamp(x,24,944),k:s.k,d:s.d===-1?-1:1,l:clamp(isFinite(l)?l:200,60,460),a:a});
      }
    }
    if(Array.isArray(o.buys)){for(const b of o.buys.slice(-12)){if(typeof b==='string'&&b.length===1&&'sfth'.indexOf(b)>=0)out.buys.push(b);}}
    return out;
  }catch(e){try{localStorage.removeItem(SKEY);}catch(_){}return null;}
}

    n=tk>=0?(tk===old?old:old+Math.sign(tk-old)):(old+1)%3;}
  else if(dir===2)n=old;
  else n=clamp(old+dir,0,2);
  M.lev=n;
  const sg=n!==old?Math.sign(LEVA[n]-LEVA[old]):(dir===2?0:(dir||1));
  M.flexV+=sg*9;M.av+=sg*2.5;if(dir===2){M.press=1;M.flexV+=(rnd()-0.5)*4;}

    else if(b.st===3){const g=GEARS[b.k],e=TUBES[b.k];const f=clamp(b.t/0.09,0,1);b.x=lerp(e[e.length-2],g.x,f);b.y=lerp(e[e.length-1],g.y-6,f);
      if(f>=1){gearHit(b.k);b.st=4;b.t=0;b.vy=-140;b.vx=(1-b.k)*60+(rnd()-0.5)*50;}}

function updCake(dt,sh){

      const s=SHOPS.find(function(o){return o.ty==='s';});if(s){s.cakes=Math.min(3,s.cakes+1);s.restock=1;s.bell=1;SFX.bell(1.1);}}
    return;
  }
  if(shaded){
    CK.cover=approach(CK.cover,0,dt*2.4);

        bits('t',CAKE_X,505,16,[C.red,C.yel,C.teal,C.white],220,360,7,1.1,180);
        lookAt(CAKE_X,520,2);
      }
    }

    if(CK.deco>0.01){CK.melt=Math.min(1,CK.melt+dt*0.9);if(CK.melt>0.45){CK.deco=Math.max(0,CK.deco-dt*0.7);CK.step=Math.floor(CK.deco);}}

  }
}

const CCOL=[C.red,C.navy,C.teal,C.yel];
function spawnCust(side,tgt){
  const maxC=WL.open>0.5?6:4;if(CUST.length>=maxC)return null;
  const b=(rnd()*4)|0;let h=(rnd()*4)|0;if(h===b)h=(h+1)%4;
  const c={id:custId++,x:side>0?1000:-50,dep:rnd(),dir:side>0?-1:1,spd:46+rnd()*16,st:'walk',tgt:null,queue:[],items:[],
    visited:{},shopV:{},passed:{},signsB:{},via:null,bridge:0,afterDir:0,t:0,ph:rnd()*TAU,body:CCOL[b],hair:CCOL[h],kind:(rnd()*3)|0,hop:0,sc:1,look:0,dead:false};
  if(tgt!==undefined&&tgt!==null){c.tgt=tgt;c.st='go';}
  CUST.push(c);return c;
}
function nearestDoor(x,dir,c){let best=null,bd=1e9;for(const i of doorsAvail()){if(c.shopV[i])continue;const d=(doorX(i)-x)*dir;if(d>4&&d<bd){bd=d;best=i;}}return best;}
function onSign(c,s){
  c.hop=1;c.look=1;
  if(s.kind==='dot'){c.st='pause';c.t=0;SFX.hop();return;}
  if(s.kind==='arrow'){
    const od=c.dir;c.dir=s.dir;c.afterDir=s.dir;
    const t=nearestDoor(s.x,s.dir,c);
    if(t!==null){c.tgt=t;c.st='go';c.via=s.id;}
    if(od!==c.dir||t!==null){const n=!D[4];disc(4);if(n){SFX.success();bits('t',s.x,GY-70,10,[C.yel,C.white],160,250,6,0.9,90);}}
    SFX.hop();return;
  }
  const a=s.doors[0],b=s.doors[1];
  if(c.shopV[a]&&c.shopV[b])return;
  const da=Math.abs(doorX(a)-c.x),db=Math.abs(doorX(b)-c.x);
  let first=da<=db?a:b,second=first===a?b:a;
  if(c.shopV[first]){first=second;second=null;}
  c.tgt=first;c.queue=second!==null&&!c.shopV[second]?[second]:[];c.st='go';c.bridge=s.id;c.via=s.id;
  c.afterDir=second!==null?(Math.sign(doorX(second)-doorX(first))||c.dir):c.dir;
  SFX.hop();
}
function updCust(dt){
  if(T>=nextCust){
    spawnCust(WL.open>0.5?(rnd()<0.5?-1:1):1);
    nextCust=T+(WL.open>0.5?3.6+rnd()*3:7+rnd()*4);
  }
  const lo=WL.open>0.5?-70:WINL+56;
  for(const c of CUST){
    c.t+=dt;c.hop=Math.max(0,c.hop-dt*2.4);c.look=Math.max(0,c.look-dt*0.8);
    if(WL.target===0&&c.x<WINL+50&&c.st!=='in'){
      if(WL.open<0.35){c.dead=true;continue;}
      if(c.st==='walk'||c.st==='pause'||c.st==='peek'){c.dir=1;c.st='walk';c.x+=dt*c.spd*1.8;continue;}
      if(c.st==='go'&&c.tgt===3){c.tgt=null;c.st='walk';c.dir=1;}
    }
    if(c.st==='walk'){
      const nx=c.x+c.dir*c.spd*dt;let hit=null;
      for(const s of SIGNS){if(s.rise<0.95||s.drag||s.lift>4||c.visited[s.id])continue;if((c.x-s.x)*(nx-s.x)<=0){hit=s;break;}}
      c.x=nx;
      if(hit){c.visited[hit.id]=1;onSign(c,hit);}
      else{
        for(const s of SHOPS){if(c.passed[s.i])continue;if(Math.abs(c.x-s.x)<4){c.passed[s.i]=1;
          if(s.awnOut&&!c.shopV[s.i]&&rnd()<0.5){c.tgt=s.i;c.st='go';c.via=null;}}}
      }
      if(c.st==='walk'){
        if(c.dir<0&&c.x<lo){if(WL.open>0.5)c.dead=true;else{c.x=lo;c.st='peek';c.t=0;c.hop=1;}}
        if(c.dir>0&&c.x>1012)c.dead=true;
      }
    }else if(c.st==='go'){
      if(c.tgt===3&&WL.open<0.8){c.tgt=null;c.st='walk';continue;}
      const tx=doorX(c.tgt),dx=tx-c.x;
      if(Math.abs(dx)<3){c.st='in';c.t=0;}
      else{c.dir=Math.sign(dx);c.x+=c.dir*Math.min(Math.abs(dx),c.spd*1.2*dt);}
    }else if(c.st==='in'){
      c.sc=Math.max(0,1-c.t/0.35);
      if(c.t>1.35){purchase(c,c.tgt);c.st='out';c.t=0;}
    }else if(c.st==='out'){
      c.sc=Math.min(1,c.t/0.35);
      if(c.t>0.45){c.sc=1;if(c.queue.length){c.tgt=c.queue.shift();c.st='go';}else{c.tgt=null;c.st='walk';if(c.afterDir)c.dir=c.afterDir;}}
    }else if(c.st==='pause'){if(c.t>1.2)c.st='walk';}
    else if(c.st==='peek'){c.look=1;if(c.t>1.5){c.dir=1;c.st='walk';}}
  }
  for(let i=CUST.length-1;i>=0;i--)if(CUST[i].dead)CUST.splice(i,1);
}

  if(WL.open>=1&&SIGNS.length>=2&&!D[6]){
    // can two different signs lead one walker to two shops? (two bridges over the same doors cannot)
    let arrows=0;const bset={};for(const g of SIGNS){if(g.kind==='arrow')arrows++;else if(g.kind==='bridge')bset[g.doors.slice().sort().join()]=1;}
    const capable=arrows>=2||(arrows>=1&&Object.keys(bset).length>=1)||Object.keys(bset).length>=2;
    if(capable){let t=SIGNS[SIGNS.length-1];for(const g of SIGNS)if(g.kind==='arrow')t=g;return {kind:'sign',s:t};}

// ============================================================
//  input : one finger at a time (extra fingers ignored)
// ============================================================
let act=null;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function segDist(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy||1;const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l,0,1);return Math.hypot(p.x-a.x-vx*t,p.y-a.y-vy*t);}
function hitLever(ml){const k=knobPos();return dist(ml,k)<86||segDist(ml,JUN,k)<48||dist(ml,JUN)<60;}
function hitHat(tl){const h=hatPose();const dx=tl.x-h.x,dy=tl.y-(h.y-14);const rx=Math.max(84,H.hw+24),ry=70;return dx*dx/(rx*rx)+dy*dy/(ry*ry)<=1;}
function signRect(s){const w=Math.max(signW(s),96);const top=s.kind==='dot'?GY-100:GY-116;return {x0:s.x-w/2-20,x1:s.x+w/2+20,y0:top-s.lift-14,y1:GY+28-s.lift};}
function hitSign(s,tl){
  if(s.rise<0.9)return null;const r=signRect(s);
  if(tl.x<r.x0||tl.x>r.x1||tl.y<r.y0||tl.y>r.y1)return null;
  if(s.kind==='dot')return 'move';
  return Math.abs(tl.x-s.x)>signW(s)*0.27?'end':'move';
}
function inReg(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  initAudio();DIR.idle=0;
  if(act)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p={x:e.clientX,y:e.clientY},ml=s2m(p.x,p.y),tl=s2t(p.x,p.y),inT=inReg(p,RT);
  if(inT&&DIR.camVis&&dist(tl,CAM)<64){act={id:e.pointerId,kind:'cam'};return;}
  if(!inT&&hitLever(ml)){
    act={id:e.pointerId,kind:'lever',sx:p.x,sy:p.y,t0:T,done:false};
    M.press=1;M.flexV+=(M.lev===2?-3:3);tone(1800,0.02,'square',0.03);return;
  }
  if(inT){
    for(let i=SIGNS.length-1;i>=0;i--){
      const s=SIGNS[i],z=hitSign(s,tl);
      if(z){act={id:e.pointerId,kind:'sign',s:s,mode:z,sx:p.x,sy:p.y,ox:s.x-tl.x,mv:0,flipped:false};if(z==='move')s.drag=true;s.wob=0.5;SFX.tap();return;}
    }
    if(H.on&&hitHat(tl)){act={id:e.pointerId,kind:'hat',sx:p.x,sy:p.y,off:false,mv:0};H.drag=true;H.wobV+=3;tone(900,0.03,'sine',0.04);return;}
  }

}
function onMove(e){
  if(!act||e.pointerId!==act.id)return;
  if(e.cancelable)e.preventDefault();
  const p={x:e.clientX,y:e.clientY};
  if(act.kind==='lever'){
    const dx=(p.x-act.sx)/LM.s,dy=(p.y-act.sy)/LM.s;M.drag=clamp(dx,-60,60);
    if(!act.done&&Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*0.5){act.done=true;leverStep(dx>0?1:-1);}
    else if(!act.done&&Math.abs(dy)>26&&Math.abs(dy)>Math.abs(dx)){act.done=true;leverStep(2);}
  }else if(act.kind==='hat'){
    const up=(act.sy-p.y)/LT.s,sx=(p.x-act.sx)/LT.s;act.mv=Math.max(act.mv,Math.hypot(up,sx));
    if(!act.off){H.lift=clamp(up,0,90);H.liftX=clamp(sx*0.4,-30,30);if(up>58){act.off=true;H.hx=p.x;H.hy=p.y;removeHat();}}
    else{H.hx=p.x;H.hy=p.y;}
  }else if(act.kind==='sign'){
    const s=act.s,tl=s2t(p.x,p.y),dx=(p.x-act.sx)/LT.s,dy=(p.y-act.sy)/LT.s;act.mv=Math.max(act.mv,Math.hypot(dx,dy));
    if(act.mode==='end'){
      if(!act.flipped&&dx*s.dir<-22&&Math.abs(dx)>Math.abs(dy)){flipSign(s);act.flipped=true;}
      else if(!act.flipped&&act.mv>56){act.mode='move';s.drag=true;act.ox=s.x-tl.x;}
    }
    if(act.mode==='move'){s.x=clamp(tl.x+act.ox,24,944);s.lift=clamp(-dy,0,240);}
  }
}
function releaseHat(){
  H.held=false;const b=m2s(HOP.x,HOP.y);
  H.fly={t:0,x0:H.hx,y0:H.hy,x1:b.x,y1:b.y,x:H.hx,y:H.hy,rot:0};SFX.whoosh();
}
function onUp(e){

    }else if(a.mode==='end'&&!a.flipped)flipSign(s);

function onCancel(e){

function miscTap(p,ml,tl,inT){
  let hit=false;
  if(!inT){
    if(dist(ml,HOP)<64){M.hopWob=1;hit=true;}
    for(let k=0;k<3&&!hit;k++)if(dist(ml,GEARS[k])<GEARR+10){M.gears[k].v+=2.5;M.gears[k].bump=0.5;hit=true;}
    for(let k=0;k<3&&!hit;k++)for(let u=0;u<=1.001;u+=0.1){if(dist(ml,tubePt(k,u))<24){M.wob[k]=1;hit=true;break;}}
  }else{

function thick(pts,hw){
  const n=pts.length/2,Lp=[],Rp=[];
  for(let i=0;i<n;i++){
    const x=pts[i*2],y=pts[i*2+1];let nx=0,ny=0;
    if(i>0){const dx=x-pts[i*2-2],dy=y-pts[i*2-1],l=Math.hypot(dx,dy)||1;nx+=-dy/l;ny+=dx/l;}
    if(i<n-1){const dx=pts[i*2+2]-x,dy=pts[i*2+3]-y,l=Math.hypot(dx,dy)||1;nx+=-dy/l;ny+=dx/l;}
    const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
    Lp.push(x+nx*hw,y+ny*hw);Rp.push(x-nx*hw,y-ny*hw);
  }
  const out=Lp.slice();for(let i=n-1;i>=0;i--)out.push(Rp[i*2],Rp[i*2+1]);return out;
}
function gearPath(r,teeth,hole){

}
