<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9c8a8">
<title>くだもの わってみよう</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#cdb894;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
#veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#f3e6cc 0%,#d8c29a 60%,#b89c72 100%);
  transition:opacity .8s ease;z-index:5;pointer-events:none}
#veil.off{opacity:0}
#veil .dot{width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffd9a0 0%,#f08c2a 35%,#b85a10 100%);
  box-shadow:0 10px 18px rgba(80,50,20,.35);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-8px) scale(1)}to{transform:translateY(8px) scale(.96,1.04)}}
#nogl{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="veil"><div class="dot"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
